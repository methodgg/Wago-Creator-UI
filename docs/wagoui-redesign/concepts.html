<main class="page">
  <header class="intro flex between"><h1>WagoUI concepts</h1><button id="reset" class="link small">Reset</button></header>
  <nav class="concepts" aria-label="UI concepts" id="concepts"></nav>
  <section class="app" aria-label="WagoUI prototype">
    <header class="app-header"><div class="flex"><div class="brand"><span>Wago</span>UI</div></div><nav class="mode" aria-label="WagoUI workspace"><button data-mode="install">Install</button><button data-mode="create">Create</button></nav></header>
    <div class="packbar flex between"><div class="flex wrap"><select id="pack" aria-label="UI pack"></select></div><div id="pack-actions" class="flex"><button id="new-pack" class="small" title="New pack" aria-label="New pack">+</button><button id="preview" class="small">Preview</button></div></div>
    <div class="content" id="content"></div>
    <footer class="footer flex between wrap" id="footer"></footer>
  </section>
  <p class="footnote">Prototype · Actions are simulated.</p>
</main>

<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script id="pack-model">
(() => {
// The prototype owns no live addon data. This model exists only to exercise the proposed interactions.
let nextDemoID = 0;
const Model = {
  nextID() { return ++nextDemoID; },
  createPack(name) { return {id:'pack-'+(++nextDemoID),name,variations:[{id:'default',name:'Default',resolution:null,description:''}],profiles:[]}; },
  validateVariation(pack, name, resolution, ignore) {
    name=name.trim();
    if(!name) throw Error('Enter a variation name.');
    if(pack.variations.some(v=>v.id!==ignore && v.name.toLowerCase()===name.toLowerCase())) throw Error('A variation with that name already exists.');
    if(resolution && (!Number.isInteger(resolution.width)||!Number.isInteger(resolution.height)||resolution.width<1||resolution.height<1)) throw Error('Enter a positive whole number for width and height.');
    return name;
  },
  addProfile(pack, source, memberships) {
    if(pack.profiles.some(p=>p.addon===source.addon && p.sourceKey===source.sourceKey)) throw Error('This profile is already in the pack. Edit its variation tags instead.');
    const first=!pack.profiles.some(p=>p.addon===source.addon);
    const tags=first?['default']:memberships;
    if(!tags?.length) throw Error('Choose at least one variation for this additional profile.');
    if(tags.some(id=>!pack.variations.some(v=>v.id===id))) throw Error('That variation no longer exists.');
    const profile={...source,id:'profile-'+(++nextDemoID),variationIds:[...new Set(tags)]};
    pack.profiles.push(profile);return profile;
  },
  removeVariation(pack,id) {
    if(id==='default') throw Error('Keep the Default variation as the starting point for new profiles.');
    pack.variations=pack.variations.filter(v=>v.id!==id);
    pack.profiles.forEach(p=>p.variationIds=p.variationIds.filter(v=>v!==id));
  },
  visible(pack,id) {return pack.profiles.filter(p=>p.variationIds.includes(id));},
  selfCheck() {
    let checks=0;const ok=(value,message)=>{if(!value)throw Error(message);checks++};
    const fails=(fn)=>{try{fn();return false}catch{return true}};
    const p=this.createPack('Test');p.variations.push({id:'wide',name:'Ultrawide'});
    const first=this.addProfile(p,{addon:'ElvUI',sourceKey:'Raid'});
    ok(first.variationIds.join()==='default','First addon profile must join Default');
    ok(fails(()=>this.addProfile(p,{addon:'ElvUI',sourceKey:'Compact'})),'Additional profile must require a variation');
    const second=this.addProfile(p,{addon:'ElvUI',sourceKey:'Compact'},['default','wide']);
    ok(this.visible(p,'default').length===2 && this.visible(p,'wide').length===1,'Multiple profiles and memberships must be allowed');
    first.variationIds=['wide'];ok(!this.visible(p,'default').includes(first),'First profile tags must be editable');
    p.variations[1].name='Cinema';ok(this.visible(p,'wide').length===2,'Rename must preserve membership IDs');
    ok(fails(()=>this.validateVariation(p,' cinema ',null)),'Duplicate names must be rejected');
    ok(fails(()=>this.validateVariation(p,'Bad',{width:0,height:1080})),'Invalid resolutions must be rejected');
    ok(this.validateVariation(p,'Portable',null)==='Portable','Any resolution must be valid');
    ok(fails(()=>this.addProfile(p,{addon:'ElvUI',sourceKey:'Raid'},['wide'])),'Duplicate source must be rejected');
    this.removeVariation(p,'wide');ok(p.profiles.length===2 && first.variationIds.length===0 && second.variationIds.join()==='default','Deleting variation must preserve profiles and other tags');
    ok(fails(()=>this.removeVariation(p,'default')),'Default deletion must be guarded');
    ok(fails(()=>this.addProfile(p,{addon:'ElvUI',sourceKey:'Healing'},['missing'])),'Stale membership must be rejected');
    const other=this.createPack('Other');ok(other.profiles.length===0 && other.variations.length===1,'Packs must be independent');
    return `${checks} model checks passed`;
  }
};
window.Model = Model;
})();
</script>
<script>
(() => {
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const descriptions=[
  ['Addons & tags','Recommended','An addon-first list keeps every profile and its variation tags in view. A compact selector combines switching, editing, deleting and creating variations, inspired by MethodInternal.'],
  ['Variation workspace','Layout focused','Pick a variation in the left rail, then build its addon lineup. Shared profiles remain single records; the rail makes each layout’s name, resolution and completeness visible.'],
  ['Membership matrix','Overview focused','Profiles are rows and variations are columns. Check membership directly, compare sharing at a glance, and edit a variation from its column header.']
];
const source=(addon,sourceKey,kind='profile',extra={})=>({addon,sourceKey,label:sourceKey,kind,...extra});
const sources=[source('ElvUI','Raid'),source('ElvUI','Compact'),source('ElvUI','Healing'),source('Details','Clean'),source('Details','Streamer'),source('Plater','Standard'),source('Plater','Wide'),source('Cell','Healer'),source('Cell','Dungeon'),source('WeakAuras','Raid tools','group'),source('WeakAuras','Dungeon timers','group'),source('Cooldown Manager','Havoc DH','profile',{className:'Demon Hunter'}),source('Bartender4','Minimal')];
let state;
function reset(){clearTimeout(toastTimer);$('#toast').classList.add('hidden');$('#dialog').close();const p=Model.createPack('Aster UI');p.id='aster';p.variations.push({id:'compact',name:'Compact',resolution:{width:1920,height:1080},description:'Tighter spacing for smaller screens.'},{id:'wide',name:'Ultrawide',resolution:{width:3440,height:1440},description:'Room to breathe, with wider raid frames.'});
  const memberships=[['default','wide'],['compact'],['default','compact','wide'],['default','compact'],['wide'],['default','wide'],['compact'],['default','wide'],['compact'],['default','compact','wide']];
  [sources[0],sources[1],sources[3],sources[5],sources[6],sources[7],sources[8],sources[9],sources[10],sources[11]].forEach((s,i)=>p.profiles.push({...s,id:'p'+i,variationIds:memberships[i]}));
  const q=Model.createPack('Minimal UI');q.id='minimal';Model.addProfile(q,sources[3]);Model.addProfile(q,sources[12]);
  state={concept:0,mode:'create',packId:'aster',variation:'default',filter:'',view:'wizard',step:0,packs:[p,q],selections:{},imported:{},menu:false,dirty:false};render();}
const pack=()=>state.packs.find(p=>p.id===state.packId), variation=()=>pack().variations.find(v=>v.id===state.variation)||pack().variations[0];
const res=v=>v.resolution?`${v.resolution.width} × ${v.resolution.height}`:'Any resolution';
const icon=a=>`<span class="icon ${a==='WeakAuras'?'wa':a==='Cooldown Manager'?'cdm':''}">${a==='WeakAuras'?'WA':a==='Cooldown Manager'?'CD':esc(a.slice(0,2))}</span>`;
const count=v=>Model.visible(pack(),v.id).length;
const tags=p=>p.variationIds.length?p.variationIds.map(id=>{let v=pack().variations.find(v=>v.id===id);return `<span class="chip ${id==='default'?'red':''}">${esc(v.name)}</span>`}).join(''):'<span class="small amber">Unassigned</span>';
function groupProfiles(profiles){return [...new Set(profiles.map(p=>p.addon))].map(addon=>({addon,profiles:profiles.filter(p=>p.addon===addon)}));}
function variationMenu(){return `<div class="menu-holder"><button id="variation-menu" aria-label="Variation" title="Variation" aria-haspopup="true" aria-expanded="${state.menu}">${esc(variation().name)} ▾</button>${state.menu?`<div class="menu" aria-label="Variations">${pack().variations.map(v=>`<div class="menu-row"><button class="pick" data-variation="${v.id}">${v.id===state.variation?'✓ ':''}${esc(v.name)}<small>${res(v)}</small></button><button class="mini" data-edit="${v.id}" title="Edit ${esc(v.name)}" aria-label="Edit ${esc(v.name)}">✎</button><button class="mini danger" data-delete="${v.id}" ${v.id==='default'?'disabled':''} title="Delete ${esc(v.name)}" aria-label="Delete ${esc(v.name)}">×</button></div>`).join('')}<hr><button class="link" data-new-variation>+ New variation</button></div>`:''}</div>`;}
function profileRow(p){return `<div class="profile"><div class="name"><div class="profile-name">${esc(p.label)}</div>${p.className?`<span class="small muted">${esc(p.className)}</span>`:''}</div><div class="tags">${tags(p)}</div><button data-tags="${p.id}" title="Edit variations" aria-label="Edit variations for ${esc(p.addon+' '+p.label)}">⋯</button></div>`;}
function render(){const p=pack();if(!p.variations.some(v=>v.id===state.variation))state.variation='default';
  $('#concepts').innerHTML=descriptions.map((d,i)=>`<button class="concept ${i===state.concept?'selected':''}" data-concept="${i}" title="${esc(d[2])}" aria-pressed="${i===state.concept}"><b>${String.fromCharCode(65+i)} · ${d[0]}</b></button>`).join('');
  document.querySelectorAll('[data-mode]').forEach(b=>{b.classList.toggle('active',b.dataset.mode===state.mode);b.setAttribute('aria-pressed',b.dataset.mode===state.mode)});
  $('#pack').innerHTML=state.packs.map(p=>`<option value="${p.id}" ${p.id===state.packId?'selected':''}>${esc(p.name)}</option>`).join('');$('#pack-actions').classList.toggle('hidden',state.mode!=='create');
  if(state.mode==='create')renderCreator();else renderInstaller();
}
function renderCreator(){let profiles=pack().profiles.filter(p=>!state.filter||(p.addon+' '+p.label).toLowerCase().includes(state.filter.toLowerCase()));
  const title=`<div class="content-title flex between wrap"><div><h2>${state.concept===0?'Profiles':state.concept===1?esc(variation().name):'Memberships'}</h2></div><button data-add class="primary">+ Add profile</button></div>`;
  const toolbar=`<div class="toolbar flex between wrap"><input id="search" aria-label="Search addons or profiles" placeholder="Search…" value="${esc(state.filter)}">${state.concept===0?variationMenu():`<button data-new-variation>+ New variation</button>`}</div>`;
  let body='';
  if(state.concept===0)body=groupProfiles(profiles).map(g=>`<section class="group"><div class="group-header">${icon(g.addon)}<div class="name"><h3>${esc(g.addon)}</h3></div><button class="small link" data-add-addon="${esc(g.addon)}" title="Add ${esc(g.addon)} profile" aria-label="Add ${esc(g.addon)} profile">+</button></div>${g.profiles.map(profileRow).join('')}</section>`).join('')||'<div class="empty">No matching profiles. Add a profile to begin.</div>';
  if(state.concept===1){const selected=profiles.filter(p=>p.variationIds.includes(state.variation));body=`<div class="bodygrid"><aside class="rail">${pack().variations.map(v=>`<button data-variation="${v.id}" class="variation-item ${v.id===state.variation?'selected':''}"><b>${esc(v.name)}</b><span>${res(v)}</span></button>`).join('')}<button class="new" data-new-variation>+ New variation</button></aside><div><div class="flex between wrap" style="margin-bottom:16px"><span class="chip" title="${esc(variation().description)}">${res(variation())}</span><div class="flex"><button class="small" data-edit="${state.variation}" title="Edit variation" aria-label="Edit variation">✎</button><button class="small danger" data-delete="${state.variation}" ${state.variation==='default'?'disabled':''} title="Delete variation" aria-label="Delete variation">×</button></div></div>${groupProfiles(selected).map(g=>`<section class="group"><div class="group-header">${icon(g.addon)}<h3>${esc(g.addon)}</h3></div>${g.profiles.map(profileRow).join('')}</section>`).join('')||'<div class="empty">No profiles yet.</div>'}<button id="reuse" class="link small">+ Existing profile</button></div></div>`;}
  if(state.concept===2)body=`<div class="matrix"><table><thead><tr><th>Addon / profile</th>${pack().variations.map(v=>`<th>${esc(v.name)}<small>${res(v)}</small><button class="small link" data-edit="${v.id}" title="Edit ${esc(v.name)}" aria-label="Edit ${esc(v.name)}">✎</button><button class="small link danger" data-delete="${v.id}" ${v.id==='default'?'disabled':''} title="Delete ${esc(v.name)}" aria-label="Delete ${esc(v.name)}">×</button></th>`).join('')}</tr></thead><tbody>${groupProfiles(profiles).map(g=>`<tr class="section"><td colspan="${pack().variations.length+1}">${esc(g.addon)}</td></tr>${g.profiles.map(p=>`<tr><td><b>${esc(p.label)}</b>${p.className?`<div class="small">${esc(p.className)}</div>`:''}</td>${pack().variations.map(v=>`<td><input type="checkbox" data-membership="${p.id}" data-v="${v.id}" ${p.variationIds.includes(v.id)?'checked':''} aria-label="Include ${esc(p.addon+' '+p.label)} in ${esc(v.name)}"></td>`).join('')}</tr>`).join('')}`).join('')}</tbody></table></div>`;
  $('#content').innerHTML=title+toolbar+body;$('#footer').innerHTML=`<div><b class="small">${state.dirty?'Unsaved':'Saved'}</b><p class="small muted">${pack().profiles.length} profiles${pack().profiles.some(p=>!p.variationIds.length)?' · Unassigned profiles':''}</p></div><button id="capture" class="primary">Save profiles</button>`;
}
function renderInstaller(){const v=variation(),profiles=Model.visible(pack(),v.id);const expert=state.view==='expert';
  let head=`<div class="content-title flex between wrap"><div><h2>${expert?'Profiles':state.step===0?'Variation':state.step===1?'Review':'Done'}</h2></div><div class="flex"><button data-view="wizard" class="${!expert?'selected':''}">Wizard</button><button data-view="expert" class="${expert?'selected':''}">Expert</button></div></div>`;
  let body='';
  if(expert){body=`<div class="toolbar flex between wrap"><select id="install-variation" aria-label="Variation">${pack().variations.map(v=>`<option value="${v.id}" ${v.id===state.variation?'selected':''}>${esc(v.name)} · ${res(v)}</option>`).join('')}</select></div><div class="expert-row expert-head"><div>Addon</div><div>Profile</div><div>Status</div><div></div></div>${profiles.map(p=>`<div class="expert-row"><div class="flex">${icon(p.addon)}<b>${esc(p.addon)}</b></div><div>${esc(p.label)}${p.className?`<div class="small muted">${esc(p.className)}</div>`:''}</div><span class="small ${state.imported[p.id]?'good':'muted'}">${state.imported[p.id]?'Up to date':'Not imported'}</span><button data-import="${p.id}">${state.imported[p.id]?'Re-import':'Import'}</button></div>`).join('')||'<div class="empty">No profiles are tagged to this variation.</div>'}`;
    $('#footer').innerHTML='<span></span><button id="alt">Alt character</button>';
  }else{body='<div class="wizard"><div class="steps"><span class="'+(state.step===0?'active':'')+'">01 · Variation</span><span>—</span><span class="'+(state.step===1?'active':'')+'">02 · Profiles</span><span>—</span><span class="'+(state.step===2?'active':'')+'">03 · Finish</span></div>';
    if(state.step===0)body+=`<div class="cards">${pack().variations.map(v=>`<button data-variation="${v.id}" class="choice ${v.id===state.variation?'selected':''}" aria-pressed="${v.id===state.variation}"><b>${esc(v.name)}</b><span class="chip">${res(v)}</span>${v.description?`<p>${esc(v.description)}</p>`:''}</button>`).join('')}</div>${v.resolution&&(v.resolution.width!==2560||v.resolution.height!==1440)?`<div class="notice">Designed for ${res(v)}. Your screen: 2560 × 1440.</div>`:''}`;
    if(state.step===1)body+=`<div class="flex between"><b>${esc(v.name)}</b><span class="chip">${res(v)}</span></div><div class="review">${groupProfiles(profiles).map(g=>g.profiles.every(p=>p.kind==='group')?`<div class="profile"><div class="name"><b>${esc(g.addon)}</b></div><div>${g.profiles.map(p=>`<label class="small"><input type="checkbox" data-group="${p.id}" ${state.selections[p.id]===false?'':'checked'}> ${esc(p.label)}</label>`).join('')}</div></div>`:`<div class="profile">${icon(g.addon)}<div class="name"><b>${esc(g.addon)}</b></div>${g.profiles.length>1?`<select data-choice="${esc(g.addon)}" aria-label="Profile for ${esc(g.addon)}"><option value="">Choose a profile…</option>${g.profiles.map(p=>`<option value="${p.id}" ${state.selections[g.addon]===p.id?'selected':''}>${esc(p.label)}</option>`).join('')}</select>`:`<span class="small">${esc(g.profiles[0].label)}</span>`}</div>`).join('')}</div>`;
    if(state.step===2)body+='<div style="padding:35px 0"><span class="badge">Installed</span></div>';
    body+='</div>';$('#footer').innerHTML=state.step===2?'<span></span><button id="finish" class="primary">Expert</button>':`<button id="back" ${state.step===0?'disabled':''}>Back</button><p class="small muted">${esc(v.name)} · ${res(v)}</p><button id="next" class="primary" ${!profiles.length?'disabled':''}>${state.step===0?'Continue':'Install'}</button>`;
  }
  $('#content').innerHTML=head+body;
}
function showDialog(title,body,submit,label='Save',onCancel){const d=$('#dialog');d.innerHTML=`<form id="dialog-form"><h2 id="dialog-title">${esc(title)}</h2>${body}<p id="dialog-error" class="error" role="alert"></p><div class="actions"><button type="button" data-cancel>Cancel</button><button class="primary" type="submit">${label}</button></div></form>`;d.returnOnCancel=onCancel;d.oncancel=e=>{e.preventDefault();d.close();d.returnOnCancel?.();};if(!d.open)d.showModal();$('#dialog-form').onsubmit=e=>{e.preventDefault();try{submit(new FormData(e.target));}catch(err){$('#dialog-error').textContent=err.message;}};}
function variationDialog(id,returnTo,onCancel){const v=id?pack().variations.find(v=>v.id===id):null;
  showDialog(v?'Edit variation':'New variation',`<label class="field">Name<input name="name" value="${esc(v?.name||'')}" maxlength="60" required autofocus></label><label class="field">Resolution<select name="resolution" id="resolution"><option value="any">Any resolution</option><option value="1920,1080">1920 × 1080</option><option value="2560,1440">2560 × 1440</option><option value="3840,2160">3840 × 2160</option><option value="3440,1440">3440 × 1440</option><option value="custom">Custom resolution…</option></select></label><div id="custom-resolution" class="resolution-fields hidden"><input name="width" aria-label="Resolution width" type="number" min="1" step="1" placeholder="Width"><input name="height" aria-label="Resolution height" type="number" min="1" step="1" placeholder="Height"></div><label class="field">Description <span class="muted">(optional)</span><textarea name="description" rows="3" maxlength="280">${esc(v?.description||'')}</textarea></label>${!v?'<label class="flex small" style="margin-top:16px"><input name="share" type="checkbox"> Include Default profiles</label>':''}`,data=>{let r=null;if(data.get('resolution')==='custom')r={width:Number(data.get('width')),height:Number(data.get('height'))};else if(data.get('resolution')!=='any'){const [width,height]=data.get('resolution').split(',').map(Number);r={width,height};}const name=Model.validateVariation(pack(),data.get('name'),r,id);let newId=id||'v-'+Model.nextID();if(v)Object.assign(v,{name,resolution:r,description:data.get('description').trim()});else{pack().variations.push({id:newId,name,resolution:r,description:data.get('description').trim()});if(data.get('share'))pack().profiles.forEach(p=>{if(p.variationIds.includes('default'))p.variationIds.push(newId);});}state.variation=newId;state.dirty=true;$('#dialog').close();render();if(returnTo)returnTo(newId);},v?'Save':'Create',onCancel);
  let current=v?.resolution?`${v.resolution.width},${v.resolution.height}`:'any';if(![...$('#resolution').options].some(o=>o.value===current)){current='custom';$('#custom-resolution').classList.remove('hidden');$('[name=width]').value=v.resolution.width;$('[name=height]').value=v.resolution.height;}$('#resolution').value=current;$('#resolution').onchange=e=>$('#custom-resolution').classList.toggle('hidden',e.target.value!=='custom');
}
const membershipChecks=selected=>`<div class="checks">${pack().variations.map(v=>`<label><input name="tags" type="checkbox" value="${v.id}" ${selected.includes(v.id)?'checked':''}> ${esc(v.name)}<small>${res(v)}</small></label>`).join('')}</div>`;
function tagDialog(id,draftTags){const p=pack().profiles.find(p=>p.id===id);showDialog('Profile variations',`<p class="muted">${esc(p.addon)} / ${esc(p.label)}</p>${membershipChecks(draftTags||p.variationIds)}<button type="button" id="new-from-tags" class="link small">+ New variation</button>`,data=>{p.variationIds=data.getAll('tags');state.dirty=true;$('#dialog').close();render();});$('#new-from-tags').onclick=()=>{const pending=new FormData($('#dialog-form')).getAll('tags');variationDialog(null,id2=>tagDialog(id,[...pending,id2]),()=>tagDialog(id,pending));};}
function addDialog(addon,chosen,selectedTags=[]){let choices=sources.filter(s=>(!addon||s.addon===addon)&&!pack().profiles.some(p=>p.addon===s.addon&&p.sourceKey===s.sourceKey));if(!choices.length){toast('All sample profiles for this addon are already included. Edit their tags to share them.');return;}const current=chosen&&choices.find(s=>s.addon===chosen.addon&&s.sourceKey===chosen.sourceKey)||choices[0];
  showDialog('Add profile',`<label class="field">Source profile<select name="source" id="source">${choices.map(s=>`<option value="${sources.indexOf(s)}" ${s===current?'selected':''}>${esc(s.addon+' / '+s.label)}</option>`).join('')}</select></label><div id="add-membership"></div>`,data=>{const s=sources[Number(data.get('source'))];Model.addProfile(pack(),s,data.getAll('tags'));state.dirty=true;$('#dialog').close();render();toast('Profile added.');},'Add profile');
  function draw(){const s=sources[Number($('#source').value)],first=!pack().profiles.some(p=>p.addon===s.addon);$('#add-membership').innerHTML=first?'<div class="notice">Variation: Default</div>':`<p class="small" style="margin-top:17px">Variations <span class="amber">*</span></p>${membershipChecks(selectedTags)}<button type="button" id="new-from-add" class="link small">+ New variation</button>`;if(!first)$('#new-from-add').onclick=()=>{const selected=dataFromAdd(),pending=new FormData($('#dialog-form')).getAll('tags');variationDialog(null,id=>addDialog(addon,selected,[...pending,id]),()=>addDialog(addon,selected,pending));};}const dataFromAdd=()=>sources[Number($('#source').value)];$('#source').onchange=draw;draw();
}
function deleteVariation(id){const v=pack().variations.find(v=>v.id===id);showDialog('Delete variation?',`<p>Remove <b>${esc(v.name)}</b> from this pack?</p><p class="small muted" style="margin-top:12px">${count(v)} profiles lose this tag. Profile data is kept.</p>`,()=>{Model.removeVariation(pack(),id);state.variation='default';state.dirty=true;$('#dialog').close();render();toast('Variation removed. Profile data kept.');},'Delete variation');}
let toastTimer;function toast(message){$('#toast').textContent=message;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),5200);}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.menu){state.menu=false;render();}});
document.addEventListener('click',e=>{if(state.menu&&!e.target.closest('.menu-holder')){state.menu=false;render();}const b=e.target.closest('button');if(!b||b.disabled)return;
  if(b.dataset.concept!==undefined){state.concept=Number(b.dataset.concept);state.menu=false;render();}
  else if(b.dataset.mode){state.mode=b.dataset.mode;state.menu=false;render();}
  else if(b.dataset.variation){state.variation=b.dataset.variation;state.menu=false;state.selections={};render();}
  else if(b.hasAttribute('data-new-variation'))variationDialog();
  else if(b.dataset.edit)variationDialog(b.dataset.edit);
  else if(b.dataset.delete)deleteVariation(b.dataset.delete);
  else if(b.hasAttribute('data-add'))addDialog();
  else if(b.dataset.addAddon)addDialog(b.dataset.addAddon);
  else if(b.dataset.tags)tagDialog(b.dataset.tags);
  else if(b.hasAttribute('data-cancel')){$('#dialog').close();$('#dialog').returnOnCancel?.();}
  else if(b.dataset.view){state.view=b.dataset.view;state.step=0;render();}
  else if(b.dataset.import){state.imported[b.dataset.import]=true;render();toast('Imported (demo).');}
  else if(b.id==='reset')reset();
  else if(b.id==='variation-menu'){state.menu=!state.menu;render();}
  else if(b.id==='preview'){state.mode='install';state.view='wizard';state.step=0;render();}
  else if(b.id==='new-pack')showDialog('New pack','<label class="field">Pack name<input name="name" required maxlength="60" autofocus></label><p class="small muted" style="margin-top:12px">Starts with Default · Any resolution.</p>',data=>{const name=data.get('name').trim();if(!name)throw Error('Enter a pack name.');if(state.packs.some(p=>p.name.toLowerCase()===name.toLowerCase()))throw Error('A pack with that name already exists.');const p=Model.createPack(name);state.packs.push(p);state.packId=p.id;state.variation='default';state.dirty=true;$('#dialog').close();render();},'Create pack');
  else if(b.id==='reuse')showDialog('Include an existing profile',`<label class="field">Profile<select name="profile">${pack().profiles.filter(p=>!p.variationIds.includes(state.variation)).map(p=>`<option value="${p.id}">${esc(p.addon+' / '+p.label)}</option>`).join('')}</select></label>`,data=>{const p=pack().profiles.find(p=>p.id===data.get('profile'));if(!p)throw Error('All profiles are already included.');p.variationIds.push(state.variation);state.dirty=true;$('#dialog').close();render();},'Include profile');
  else if(b.id==='capture')showDialog('Save profiles',`<label class="field">Release notes<textarea rows="4" placeholder="What changed in this version?"></textarea></label><p class="small muted" style="margin-top:12px">Upload through the Wago App after reload.</p>`,()=>{state.dirty=false;$('#dialog').close();render();toast('Saved (demo).');},'Save & reload');
  else if(b.id==='next'){if(state.step===0){state.step=1;render();}else{const groups=groupProfiles(Model.visible(pack(),state.variation));if(groups.some(g=>g.profiles[0].kind!=='group'&&g.profiles.length>1&&!state.selections[g.addon])){toast('Choose one profile for each addon with multiple options.');return;}groups.forEach(g=>g.profiles.forEach(p=>{if(p.kind==='group'?state.selections[p.id]!==false:g.profiles.length===1||state.selections[g.addon]===p.id)state.imported[p.id]=true;}));state.step=2;render();}}
  else if(b.id==='back'){state.step=Math.max(0,state.step-1);render();}
  else if(b.id==='finish'){state.view='expert';render();}
  else if(b.id==='alt')toast('Alt setup is not included in this prototype.');
});
document.addEventListener('change',e=>{if(e.target.id==='pack'){state.packId=e.target.value;state.variation='default';state.filter='';state.step=0;state.selections={};render();}else if(e.target.id==='install-variation'){state.variation=e.target.value;state.selections={};render();}else if(e.target.dataset.membership){const p=pack().profiles.find(p=>p.id===e.target.dataset.membership),id=e.target.dataset.v;p.variationIds=e.target.checked?[...new Set([...p.variationIds,id])]:p.variationIds.filter(v=>v!==id);state.dirty=true;render();}else if(e.target.dataset.choice)state.selections[e.target.dataset.choice]=e.target.value;else if(e.target.dataset.group)state.selections[e.target.dataset.group]=e.target.checked;});
document.addEventListener('input',e=>{if(e.target.id==='search'){let start=e.target.selectionStart,end=e.target.selectionEnd;state.filter=e.target.value;renderCreator();$('#search').focus();$('#search').setSelectionRange(start,end);}});
window.runChecks=()=>Model.selfCheck();reset();
})();
</script>
</body>
</html>
